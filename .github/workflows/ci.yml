name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.suite }} tests on NodeJS 16
    runs-on: ubuntu-22.04

    strategy:
      # Each suite reports its own check, so one failing must not cancel the
      # other: a single push has to report both.
      fail-fast: false
      matrix:
        suite: [unit, integration]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          # Kept in sync with .nvmrc and package.json engines.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report the runtime actually in use
        run: node -v && npm -v

      - name: Run the ${{ matrix.suite }} suite
        run: npm run test:${{ matrix.suite }}

  # A green suite says nothing about whether the bundle still builds, and a
  # broken build is worth its own check rather than hiding inside the tests.
  build:
    name: Production build on NodeJS 16
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
