server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # The bundle is a single page: any path has to reach index.html instead of
    # a 404, the same thing `historyApiFallback` does in the dev server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change under the same name, so they can be cached
    # for good; index.html must not be, or a deploy would go unnoticed.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
